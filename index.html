<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>

    <style>
        /* 🌸 Romantic pink background */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #ffe6f2);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* 💖 Floating emojis */
        .floating {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* 💗 Romantic box */
        .login-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.3);
            text-align: center;
            width: 300px;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            color: #d63384;
            margin-bottom: 10px;
        }

        p {
            color: #a61e5c;
        }

        /* 💕 Input field */
        input {
            width: 90%;
            padding: 12px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            margin-top: 10px;
        }

        input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 8px #ffb6c1;
        }

        /* 💖 Romantic button */
        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.6);
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 💖 Floating emojis -->
    <div class="floating" style="left: 10%;">❤️</div>
    <div class="floating" style="left: 25%; animation-delay: 2s;">💋</div>
    <div class="floating" style="left: 40%; animation-delay: 4s;">💕</div>
    <div class="floating" style="left: 60%; animation-delay: 1s;">😘</div>
    <div class="floating" style="left: 75%; animation-delay: 3s;">💖</div>
    <div class="floating" style="left: 90%; animation-delay: 5s;">🌸</div>

    <!-- 💗 Login box -->
    <div class="login-box">
        <h2>Helloooo Hottieeeee💖</h2>
        <p>Enter password correctly</p>
        <p>wrong pass = Severe punishment</p>

        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="checkPassword()">Enter</button>

        <p id="error"></p>
    </div>

    <script>
        function checkPassword() {
            var pass = document.getElementById("password").value;

            if (pass === "2425") {
                window.location.href = "home.html";
            } else {
                document.getElementById("error").innerText = "Incorrect password 💔";
            }
        }
    </script>

</body>
</html>
